name: usage-metering-billing-engine
run: "docker compose up --build -d"
seed: "docker compose exec api python -m scripts.seed"
test: "docker compose exec -T api sh -c \"pip install -e '.[test]' && python -m scripts.test\""
base_url: "http://localhost:8000"
endpoints:
  - "/health"
  - "/usage"
  - "/generate"
  - "/billing/checkout"
  - "/webhooks/stripe"
